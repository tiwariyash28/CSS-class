<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Internal</title>

    <style>
        h1{
            border-style:groove;
            border-top: double;
            border-right: dashed;
            border-left: dotted;
            border-color: black;
            background-color:aqua;
            color: black;
            border: 15px groove black;
            border-radius: 50px;
            padding: 10px 20px 30px 40px;
        }
        p{
            background-color: beige;
            color: red;
            border: 2px dashed black;
            border-radius: 100px;
            padding: 10px 20px 30px 40px;
        }
    </style>
</head>
<body>
    
    <h1>Internal CSS</h1>

    <p>This is a paragraph with internal CSS styling.</p>
    <p>I am another paragraph with internal CSS styling.</p>
</body>
</html>
